version: '3.9'

services:
  # ─── MongoDB ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: chatsphere-mongodb-dev
    ports:
      - '27017:27017'
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chatsphere
    networks:
      - chatsphere-dev

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chatsphere-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    networks:
      - chatsphere-dev

volumes:
  mongodb_dev_data:

networks:
  chatsphere-dev:
    driver: bridge
